# Ergänzung zu docker-compose.yml: baut die Images lokal statt sie aus der
# GitHub Container Registry zu laden. Zum Ausprobieren des Produktivstacks auf
# dem eigenen Rechner, bevor (oder ohne dass) es Images auf ghcr.io gibt.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     --env-file stack.env -p familytree-test up -d --build
#
# Nicht für Portainer gedacht — dort baut die NAS nichts selbst.

services:
  storage:
    image: familytree-local/minio:dev
    build:
      context: docker/minio

  storage-init:
    image: familytree-local/minio:dev

  backup-media:
    image: familytree-local/minio:dev

  migrate:
    image: familytree-local/migrate:dev
    build:
      context: .
      target: migrator

  app:
    image: familytree-local/app:dev
    build:
      context: .
      target: runner

  db-access:
    image: familytree-local/migrate:dev
