# Ergänzung zu docker-compose.yml: baut das App-Image lokal statt es aus der
# GitHub Container Registry zu laden. Zum Ausprobieren des Produktivstacks auf
# dem eigenen Rechner, bevor (oder ohne dass) es ein Image auf ghcr.io gibt.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     --env-file stack.env -p familytree-test up -d --build
#
# Nicht für Portainer gedacht — dort baut die NAS nichts selbst.

services:
  app:
    image: familytree-local/app:dev
    build:
      context: .
      target: runner
