# Baut die Container-Images und legt sie in der GitHub Container Registry ab.
# Die NAS (Portainer) lädt sie nur noch — gebaut wird dort nichts.
#
#   ghcr.io/<owner>/<repo>           Anwendung   (Dockerfile, Ziel runner)
#   ghcr.io/<owner>/<repo>-migrate   Migrator    (Dockerfile, Ziel migrator)
#
# Alle übrigen Images des Stacks (postgres, caddy) kommen unverändert von
# Docker Hub; Bilder liegen als Dateien auf der NAS, ein Objektspeicher wird
# nicht mehr gebraucht.
#
# Tags: latest (main), sha-<7 Zeichen> (jeder Lauf), <version> und
# <major>.<minor> (Git-Tags v*). Nach erfolgreichem Build auf main wird der
# Branch "deploy" auf genau diesen Commit gesetzt — Portainer beobachtet
# "deploy" statt "main" und sieht neue Compose-Dateien so erst, wenn die
# passenden Images fertig sind (README, "Updates").
#
# Neue Pakete auf ghcr.io sind zunächst privat — einmalig auf "Public"
# stellen oder Zugangsdaten in Portainer hinterlegen (README).

name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Standard: keine Rechte. Jeder Job bekommt nur, was er braucht.
permissions: {}

# Ein neuer Push auf denselben Ref bricht einen laufenden Lauf ab — so kann
# ein älterer Lauf "latest" und "deploy" nicht nachträglich zurücksetzen.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Prüfen (Typen, Lint, Unit-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Nur für `prisma generate`; es gibt hier keine Datenbank. Die
      # datenbankgestützten Tests (tests/*.db.test.ts) überspringen sich.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  images:
    name: App- und Migrator-Image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image-Namen (ghcr.io verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-migrate
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-migrate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Anwendung (runner)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: |
            type=gha,scope=runner
            type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=runner

      - name: Migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: |
            type=gha,scope=migrator
            type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=migrator

  promote:
    name: Branch "deploy" nachziehen
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git push --force origin "${GITHUB_SHA}:refs/heads/deploy"
