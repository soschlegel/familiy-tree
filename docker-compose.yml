# Produktivstack — gedacht für Portainer auf der NAS (Git-Stack).
#
# Die Images baut GitHub Actions (.github/workflows/images.yml) und legt sie
# in der GitHub Container Registry (ghcr.io) ab; die NAS lädt sie nur noch.
# Diese Datei bindet deshalb keine Dateien aus dem Repository ein — Portainer
# klont das Repo in sein eigenes Datenvolume, relative Pfade wären auf dem
# Docker-Host nicht auffindbar.
#
# Alle persistenten Daten liegen als Bind-Mounts unter EINEM Pfad
# (${DATA_ROOT}), damit die NAS-Sicherung genau ein Verzeichnis erfasst.
#
# Variablen: siehe stack.env.example (in Portainer unter "Environment
# variables" eintragen). Ablauf beim Start:
#
#   db, storage ─> storage-init (Bucket) ─> backup-media
#   db ─> backup-db (Sicherung) ─> migrate (Schema, Admin) ─> app
#
# Lokal testen ohne fertige Images: siehe docker-compose.build.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (erzeugen mit openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-familytree}
      # Feste Locale, damit Sortierung nach Nachnamen reproduzierbar bleibt.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - ${DATA_ROOT:?DATA_ROOT fehlt (absoluter Pfad auf der NAS, z.B. /volume1/docker/familytree)}/postgres:/var/lib/postgresql/data
    # Kein Port nach außen. Zugriff vom PC (MCP-Server): Profil db-access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MinIO, aus dem Quelltext gebaut (docker/minio/Dockerfile) — offizielle
  # Images gibt es nicht mehr. Enthält auch den Client mc.
  storage:
    image: ${MINIO_IMAGE:-ghcr.io/soschlegel/familiy-tree-minio:RELEASE.2025-10-15T17-29-55Z}
    restart: unless-stopped
    logging: *logging
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY fehlt (erzeugen mit openssl rand -hex 16)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY fehlt (erzeugen mit openssl rand -hex 32)}
      # Die Web-Konsole wird nicht gebraucht und ist ohnehin nicht erreichbar.
      MINIO_BROWSER: "off"
    volumes:
      - ${DATA_ROOT}/minio:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s

  # Einmal-Job: legt den Bucket an, falls er fehlt, und beendet sich.
  storage-init:
    image: ${MINIO_IMAGE:-ghcr.io/soschlegel/familiy-tree-minio:RELEASE.2025-10-15T17-29-55Z}
    restart: "no"
    logging: *logging
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-familytree}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "Bucket bereit."

  # Sicherung der Datenbank nach ${DATA_ROOT}/backups. Läuft bei jedem
  # Stack-Start VOR der Migration (Sicherung vor Schemaänderung) und lässt
  # sich jederzeit erneut auslösen:
  #   docker start -a <stackname>-backup-db-1
  backup-db:
    image: postgres:17-alpine
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-familytree}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-familytree}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${DATA_ROOT}/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu -o pipefail
        FILE="/backups/db_$$(date +%Y-%m-%d_%H%M%S).sql.gz"
        echo "[backup] Datenbank -> $$FILE"
        pg_dump --clean --if-exists --no-owner | gzip > "$$FILE.tmp"
        mv "$$FILE.tmp" "$$FILE"
        echo "[backup] Sicherungen älter als $$BACKUP_KEEP_DAYS Tage entfernen"
        find /backups -maxdepth 1 -name 'db_*.sql.gz' -mtime "+$$BACKUP_KEEP_DAYS" -print -delete
        echo "[backup] Datenbank gesichert."

  # Spiegelt die Bilder lesbar nach ${DATA_ROOT}/backups/media. Erneut
  # auslösen: docker start -a <stackname>-backup-media-1
  backup-media:
    image: ${MINIO_IMAGE:-ghcr.io/soschlegel/familiy-tree-minio:RELEASE.2025-10-15T17-29-55Z}
    restart: "no"
    logging: *logging
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-familytree}
    volumes:
      - ${DATA_ROOT}/backups/media:/backup/media
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://storage:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc mirror --overwrite --remove --quiet "local/$$S3_BUCKET" /backup/media
        echo "[backup] Bilder gespiegelt."

  # Wendet das Schema an und legt den Admin an. Läuft bei jedem Stack-Start
  # einmal und beendet sich; die App startet erst danach.
  migrate:
    image: ${IMAGE_REPO:-ghcr.io/soschlegel/familiy-tree}-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      backup-db:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-familytree}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      # Nur für Altinstallationen ohne Migrationshistorie, siehe README.
      MIGRATE_ALLOW_DATA_LOSS: ${MIGRATE_ALLOW_DATA_LOSS:-false}

  app:
    image: ${IMAGE_REPO:-ghcr.io/soschlegel/familiy-tree}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    init: true
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-familytree}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt (erzeugen mit openssl rand -base64 32)}
      # Genau die Adresse, die im Browser eingegeben wird — daraus entstehen
      # die OAuth-Callback-URLs und die Cookie-Einstellungen (https → Secure).
      AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt (genau die Adresse im Browser, z.B. https://stammbaum.example.de)}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      # Der Dev-Login bleibt in Produktion aus (greift dort ohnehin nicht).
      ENABLE_DEV_LOGIN: "false"
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-familytree}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    # Ein Port für den Reverse-Proxy der NAS. Standard: nur 127.0.0.1 — der
    # Proxy auf der NAS selbst (Synology) erreicht ihn, sonst niemand.
    # Läuft der Proxy in einem Container (Nginx Proxy Manager), APP_BIND auf
    # die LAN-IP der NAS setzen.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

  # --- Optional: eigener Reverse-Proxy (Caddy) ------------------------------
  # Nur für Installationen OHNE vorhandenen Proxy. Aktivieren mit der
  # Stack-Variable COMPOSE_PROFILES=caddy. Konfiguration steht unten inline
  # (keine Datei aus dem Repo nötig). Standard: HTTPS mit Caddys eigener
  # Zertifizierungsstelle ("tls internal") — für das LAN geeignet, der Browser
  # warnt, bis man Caddys Stammzertifikat importiert.
  proxy:
    image: caddy:2.11-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-8443}:443"
    environment:
      CADDYFILE: |
        ${CADDY_SITE:-localhost} {
          tls ${CADDY_TLS:-internal}
          encode zstd gzip
          request_body {
            max_size ${CADDY_MAX_BODY:-1GB}
          }
          reverse_proxy app:3000
        }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '%s\n' "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ${DATA_ROOT}/caddy/data:/data
      - ${DATA_ROOT}/caddy/config:/config

  # --- Optional: Datenbankzugriff vom PC (MCP-Server) ----------------------
  # Aktivieren mit COMPOSE_PROFILES=db-access (mehrere: "caddy,db-access").
  # Leitet ${DB_ACCESS_BIND}:${DB_ACCESS_PORT} an die Datenbank weiter.
  # Standard 127.0.0.1 = nur auf der NAS selbst; für den PC DB_ACCESS_BIND
  # auf die LAN-IP der NAS setzen. Nur bei Bedarf einschalten (README).
  db-access:
    image: ${IMAGE_REPO:-ghcr.io/soschlegel/familiy-tree}-migrate:${IMAGE_TAG:-latest}
    profiles: ["db-access"]
    restart: unless-stopped
    logging: *logging
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "docker/tcp-forward.mjs"]
    ports:
      - "${DB_ACCESS_BIND:-127.0.0.1}:${DB_ACCESS_PORT:-15432}:5432"
