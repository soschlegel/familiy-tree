# Produktivstack — auch für Portainer auf der NAS geeignet.
#
# Alle persistenten Daten liegen als Bind-Mounts unter einem einzigen Pfad
# (${DATA_ROOT}). Dadurch sichert die NAS-Backupaufgabe genau ein Verzeichnis
# und hat Datenbank, Bilder und Backups vollständig beisammen.
#
#   Lokal:     DATA_ROOT=./data
#   NAS:       DATA_ROOT=/volume1/docker/familytree
#
# In Portainer: Stacks -> Add stack -> Repository, und die Variablen unten
# im Abschnitt "Environment variables" setzen.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familytree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-familytree}
      # Feste Locale, damit Sortierung nach Nachnamen reproduzierbar bleibt.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familytree}"]
      interval: 10s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY fehlt}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY fehlt}
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Einmal-Job: legt den Bucket an, falls er fehlt, und beendet sich.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-familytree} &&
      echo 'Bucket bereit.'
      "
    restart: "no"

  # Nur auf Abruf (profile), nicht im normalen Stack-Start enthalten.
  # Aufruf:  docker compose run --rm backup
  backup:
    image: minio/mc:latest
    profiles: ["tools"]
    volumes:
      - ${DATA_ROOT:-./data}/backups/media:/backup/media
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mirror --overwrite --remove local/${S3_BUCKET:-familytree} /backup/media &&
      echo 'Medien gespiegelt.'
      "

  # Wendet das Schema an und legt den Admin an. Läuft einmal und beendet sich;
  # die App startet erst danach.
  migrate:
    build:
      context: .
      target: migrator
    image: familytree-migrate:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-familytree}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}

  app:
    build:
      context: .
      target: runner
    image: familytree:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-familytree}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-familytree}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt}
      AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL fehlt}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-familytree}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-15728640}
    expose:
      - "3000"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Caddy holt für diese Domain automatisch ein Let's-Encrypt-Zertifikat.
      # Für rein lokalen Betrieb: DOMAIN=localhost -> Caddy nutzt ein
      # selbstsigniertes Zertifikat, kein Internet nötig.
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-./data}/caddy/data:/data
      - ${DATA_ROOT:-./data}/caddy/config:/config
