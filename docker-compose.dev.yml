# Nur die Infrastruktur für die lokale Entwicklung.
# Die App selbst läuft daneben mit `npm run dev` — dadurch bleibt Hot-Reload
# erhalten und es muss kein Image gebaut werden.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree
      POSTGRES_DB: familytree
    ports:
      - "5432:5432"
    volumes:
      - ./data/dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytree"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" # Web-Konsole: http://localhost:9001
    volumes:
      - ./data/dev-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/familytree &&
      echo 'Bucket bereit.'
      "
    restart: "no"
