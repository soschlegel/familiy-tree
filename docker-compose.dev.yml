# Nur die Infrastruktur für die lokale Entwicklung: die Datenbank.
# Die App selbst läuft daneben mit `npm run dev` — dadurch bleibt Hot-Reload
# erhalten und es muss kein Image gebaut werden. Bilder legt die App direkt
# im Dateisystem ab (MEDIA_DIR, Standard ./data/media).
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: familytree
      POSTGRES_PASSWORD: familytree
      POSTGRES_DB: familytree
    ports:
      - "5432:5432"
    volumes:
      - ./data/dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familytree"]
      interval: 5s
      timeout: 5s
      retries: 10
